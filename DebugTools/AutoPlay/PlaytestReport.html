<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIテストプレイ レポート</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --other: #b5b3ab;
    --run-line: #c9c7bf;
    --critical: #d03b3b;
    --good: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --other: #5f5e59;
      --run-line: #3a3a37;
      --critical: #d03b3b;
      --good: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --other: #5f5e59;
    --run-line: #3a3a37;
    --critical: #d03b3b;
    --good: #0ca30c;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: var(--text-secondary); margin: 0; }
  .note { color: var(--text-muted); font-size: 12px; margin: 4px 0 0; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    margin: 16px 0; padding: 12px 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  .toolbar label { color: var(--text-secondary); }
  select, button {
    font: inherit; color: var(--text-primary); background: var(--page);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
  }
  button { cursor: pointer; }
  .drop-hint { color: var(--text-muted); font-size: 12px; }
  body.dragging main { outline: 2px dashed var(--series-1); outline-offset: 4px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
  .tile .label { color: var(--text-secondary); font-size: 12px; }
  .tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .tile .detail { color: var(--text-muted); font-size: 12px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--text-secondary); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .legend i.line { height: 2px; width: 14px; border-radius: 1px; }
  .chart { width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .grid { stroke: var(--grid); stroke-width: 1; }
  .chart .baseline { stroke: var(--axis); stroke-width: 1; }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hit:hover + .hover-ring, .chart .hit.active + .hover-ring { opacity: 1; }
  .hover-ring { fill: var(--text-primary); opacity: 0; pointer-events: none; }

  details { margin-top: 8px; }
  summary { color: var(--text-secondary); cursor: pointer; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 8px; }
  th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-secondary); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  .result-clear { color: var(--good); font-weight: 600; }
  .result-death { color: var(--critical); font-weight: 600; }

  .empty { text-align: center; padding: 48px 16px; color: var(--text-secondary); }
  .empty code { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; }

  #tooltip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18); font-size: 12px; min-width: 140px;
  }
  #tooltip .t-title { font-weight: 600; margin-bottom: 4px; }
  #tooltip .t-row { display: flex; justify-content: space-between; gap: 12px; color: var(--text-secondary); }
  #tooltip .t-row b { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
  #tooltip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
</style>
</head>
<body>
<main>
  <h1>AIテストプレイ レポート</h1>
  <p class="sub" id="session-summary">ログを読み込んでいます…</p>

  <div class="toolbar">
    <label for="session-select">表示するテスト</label>
    <select id="session-select"></select>
    <button id="open-button" type="button">ログ(JSON)を開く…</button>
    <input id="file-input" type="file" accept=".json" multiple hidden>
    <span class="drop-hint">Logs フォルダの session_*.json をドラッグ&ドロップしても追加できます</span>
  </div>

  <div id="content"></div>
</main>
<div id="tooltip" role="tooltip"></div>

<script src="Logs/latest.js"></script>
<script>
(() => {
  "use strict";

  const BIN_SIZE = 1000;//Z座標をこの幅で区切って集計する
  const FPS = 60;

  //被弾の原因の表示名と色(色は原因ごとに固定)
  const CAUSES = [
    { key: "EnemyBullet", label: "敵弾", color: "var(--series-1)" },
    { key: "Worm", label: "ワーム", color: "var(--series-2)" },
    { key: "Rock", label: "岩", color: "var(--series-3)" },
    { key: "BossBeam", label: "ボスのビーム", color: "var(--series-4)" },
    { key: "Unknown", label: "不明", color: "var(--other)" },
  ];
  const causeOf = key => CAUSES.find(c => c.key === key) || CAUSES[CAUSES.length - 1];

  const sessions = [];
  const select = document.getElementById("session-select");
  const content = document.getElementById("content");
  const tooltip = document.getElementById("tooltip");

  //------------------------------------------------------------
  //読み込み
  //------------------------------------------------------------
  function addSession(data, name) {
    if (!data || !Array.isArray(data.runs)) return false;
    const label = `${data.startedAt || name}  (${data.settings?.skill ?? "?"} / ${data.runs.length}回)`;
    const existing = sessions.findIndex(s => s.data.file && s.data.file === data.file);
    if (existing >= 0) sessions[existing] = { data, label };
    else sessions.push({ data, label });
    refreshSelect(existing >= 0 ? existing : sessions.length - 1);
    return true;
  }

  function refreshSelect(selectIndex) {
    select.innerHTML = "";
    sessions.forEach((s, i) => {
      const option = document.createElement("option");
      option.value = i;
      option.textContent = s.label;
      select.appendChild(option);
    });
    select.value = selectIndex;
    render();
  }

  function readFiles(files) {
    [...files].forEach(file => {
      const reader = new FileReader();
      reader.onload = () => {
        try { addSession(JSON.parse(reader.result), file.name); }
        catch (e) { alert(`${file.name} を読み込めませんでした: ${e.message}`); }
      };
      reader.readAsText(file, "utf-8");
    });
  }

  document.getElementById("open-button").addEventListener("click", () => document.getElementById("file-input").click());
  document.getElementById("file-input").addEventListener("change", e => readFiles(e.target.files));
  select.addEventListener("change", render);
  window.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dragging"); });
  window.addEventListener("dragleave", e => { if (e.target === document.documentElement || e.clientX === 0) document.body.classList.remove("dragging"); });
  window.addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("dragging"); readFiles(e.dataTransfer.files); });

  let resizeTimer = null;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });

  //------------------------------------------------------------
  //集計
  //------------------------------------------------------------
  function analyze(data) {
    const bossZ = data.stage?.bossAppearZ ?? 25800;
    const binCount = Math.ceil(bossZ / BIN_SIZE);
    const bossBin = binCount;//最後の列はボス戦
    const makeBins = () => Array.from({ length: binCount + 1 }, () => ({}));
    const damageBins = makeBins();
    const deathBins = makeBins();
    const rollBins = Array(binCount + 1).fill(0);
    const counterBins = Array(binCount + 1).fill(0);
    const causeTotals = {};
    const binOf = ev => ev.boss ? bossBin : Math.min(Math.max(Math.floor(ev.z / BIN_SIZE), 0), binCount - 1);

    const runs = data.runs.map(run => {
      const count = t => run.events.filter(e => e.t === t).length;
      const counters = run.events.filter(e => e.t === "counter");
      run.events.forEach(ev => {
        const bin = binOf(ev);
        if (ev.t === "damage") {
          const key = causeOf(ev.cause).key;
          damageBins[bin][key] = (damageBins[bin][key] || 0) + 1;
          causeTotals[key] = (causeTotals[key] || 0) + 1;
        } else if (ev.t === "death") {
          const key = causeOf(ev.cause).key;
          deathBins[bin][key] = (deathBins[bin][key] || 0) + 1;
        } else if (ev.t === "roll") {
          rollBins[bin]++;
        } else if (ev.t === "counter") {
          counterBins[bin]++;
        }
      });
      const stageStart = Math.max(run.stageStartFrame, 0);
      return {
        index: run.index,
        result: run.result,
        reachedZ: run.reachedZ,
        bossAppearFrame: run.bossAppearFrame,
        seconds: (run.frames - stageStart) / FPS,
        damage: count("damage"),
        deathCause: run.deathCause,
        counterBullet: counters.filter(e => e.cause === "EnemyBullet").length,
        counterBeam: counters.filter(e => e.cause === "BossBeam").length,
        rolls: count("roll"),
        kills: count("kill"),
        samples: (run.samples || []).filter(s => run.bossAppearFrame < 0 || s[0] < run.bossAppearFrame),
      };
    });

    return { bossZ, binCount, damageBins, deathBins, rollBins, counterBins, causeTotals, runs };
  }

  //------------------------------------------------------------
  //描画の部品
  //------------------------------------------------------------
  const svgNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    const node = document.createElementNS(svgNS, tag);
    Object.entries(attrs || {}).forEach(([k, v]) => node.setAttribute(k, v));
    if (parent) parent.appendChild(node);
    return node;
  }
  function html(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  //ほどよい目盛りの間隔
  //(回数のグラフなので目盛りは整数だけにする)
  function niceStep(max, targetTicks) {
    if (max <= 0) return 1;
    const raw = max / targetTicks;
    const pow = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / pow;
    return Math.max(1, (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * pow);
  }
  //上だけ角を丸めた棒(基準線側は四角)
  function topRoundedRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h);
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  }
  function showTooltip(event, title, rows) {
    tooltip.innerHTML = "";
    tooltip.appendChild(html("div", "t-title", title));
    rows.forEach(r => {
      const row = html("div", "t-row");
      const name = html("span");
      if (r.color) { const sw = html("i"); sw.style.background = r.color; name.appendChild(sw); }
      name.appendChild(document.createTextNode(r.label));
      const value = html("b", "", r.value);
      row.append(name, value);
      tooltip.appendChild(row);
    });
    tooltip.style.display = "block";
    const pad = 14;
    let x = event.clientX + pad, y = event.clientY + pad;
    const rect = tooltip.getBoundingClientRect();
    if (x + rect.width > window.innerWidth - 8) x = event.clientX - rect.width - pad;
    if (y + rect.height > window.innerHeight - 8) y = event.clientY - rect.height - pad;
    tooltip.style.left = `${x}px`;
    tooltip.style.top = `${y}px`;
  }
  function hideTooltip() { tooltip.style.display = "none"; }

  function legend(items) {
    const box = html("div", "legend");
    items.forEach(item => {
      const span = html("span");
      const sw = html("i", item.line ? "line" : "");
      sw.style.background = item.color;
      span.append(sw, document.createTextNode(item.label));
      box.appendChild(span);
    });
    return box;
  }
  function card(title, note, legendNode) {
    const box = html("section", "card");
    const head = html("div", "card-head");
    const titles = html("div");
    titles.appendChild(html("h2", "", title));
    if (note) titles.appendChild(html("p", "note", note));
    head.appendChild(titles);
    if (legendNode) head.appendChild(legendNode);
    box.appendChild(head);
    return box;
  }
  function binLabel(info, bin) {
    if (bin === info.binCount) return "ボス戦";
    return `Z ${(bin * BIN_SIZE).toLocaleString()}〜${Math.min((bin + 1) * BIN_SIZE, info.bossZ).toLocaleString()}`;
  }
  function tableView(headers, rows) {
    const details = html("details");
    details.appendChild(html("summary", "", "表で見る"));
    const wrap = html("div", "table-wrap");
    const table = html("table");
    const thead = html("thead");
    const tr = html("tr");
    headers.forEach(h => tr.appendChild(html("th", "", h)));
    thead.appendChild(tr);
    table.appendChild(thead);
    const tbody = html("tbody");
    rows.forEach(r => {
      const row = html("tr");
      r.forEach(v => row.appendChild(html("td", "", v)));
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    details.appendChild(wrap);
    return details;
  }

  //------------------------------------------------------------
  //Zごとの積み上げ棒グラフ(下にステージ構成の帯を付ける)
  //------------------------------------------------------------
  function stackedBinChart(container, info, layout, series, valueOf, tooltipTitle) {
    const width = Math.max(container.clientWidth, 320);
    const margin = { top: 8, right: 8, bottom: 52, left: 32 };
    const plotH = 180;
    const height = margin.top + plotH + margin.bottom;
    const svg = el("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" }, container);

    const bins = info.binCount + 1;
    const totals = Array.from({ length: bins }, (_, b) => series.reduce((sum, s) => sum + valueOf(b, s.key), 0));
    const maxTotal = Math.max(1, ...totals);
    const step = niceStep(maxTotal, 4);
    const top = Math.ceil(maxTotal / step) * step;
    const plotW = width - margin.left - margin.right;
    const slot = plotW / bins;
    const gap = 2;
    const barW = Math.max(slot - Math.max(gap, slot * 0.25), 2);
    const y = v => margin.top + plotH - (v / top) * plotH;

    for (let v = 0; v <= top; v += step) {
      el("line", { class: v === 0 ? "baseline" : "grid", x1: margin.left, x2: width - margin.right, y1: y(v), y2: y(v) }, svg);
      const t = el("text", { x: margin.left - 6, y: y(v) + 4, "text-anchor": "end" }, svg);
      t.textContent = v;
    }

    for (let b = 0; b < bins; b++) {
      const x = margin.left + b * slot + (slot - barW) / 2;
      let acc = 0;
      const drawn = series.filter(s => valueOf(b, s.key) > 0);
      drawn.forEach((s, i) => {
        const v = valueOf(b, s.key);
        const y0 = y(acc), y1 = y(acc + v);
        const h = Math.max(y0 - y1 - (i > 0 ? gap : 0), 1);
        const isTop = i === drawn.length - 1;
        if (isTop) el("path", { d: topRoundedRect(x, y1, barW, h, 4), fill: s.color }, svg);
        else el("rect", { x, y: y1 + (i > 0 ? 0 : 0), width: barW, height: h, fill: s.color }, svg);
        acc += v;
      });

      //マウスを乗せる範囲は列全体
      const hit = el("rect", { class: "hit", x: margin.left + b * slot, y: margin.top, width: slot, height: plotH }, svg);
      hit.addEventListener("mousemove", e => showTooltip(e, `${binLabel(info, b)}  ${tooltipTitle}`,
        [...series.map(s => ({ label: s.label, value: valueOf(b, s.key), color: s.color })),
         { label: "合計", value: totals[b] }]));
      hit.addEventListener("mouseleave", hideTooltip);
    }

    //横軸
    const axisY = margin.top + plotH;
    const labelEvery = Math.ceil(5000 / BIN_SIZE);
    for (let b = 0; b <= info.binCount; b += labelEvery) {
      const t = el("text", { x: margin.left + b * slot, y: axisY + 14, "text-anchor": "middle" }, svg);
      t.textContent = (b * BIN_SIZE).toLocaleString();
    }
    const bossLabel = el("text", { x: margin.left + info.binCount * slot + slot / 2, y: axisY + 14, "text-anchor": "middle" }, svg);
    bossLabel.textContent = "ボス";

    //ステージ構成の帯(岩と敵の位置)
    const stripY = axisY + 24;
    const stageW = info.binCount * slot;
    const zx = z => margin.left + (z / (info.binCount * BIN_SIZE)) * stageW;
    el("rect", { x: margin.left, y: stripY, width: stageW, height: 18, rx: 3, fill: "var(--page)" }, svg);
    (layout || []).forEach(item => {
      if (item.z < 0 || item.z > info.binCount * BIN_SIZE) return;
      if (item.type === "rock") el("rect", { x: zx(item.z) - 1, y: stripY + 2, width: 2, height: 6, fill: "var(--text-muted)" }, svg);
      else el("circle", { cx: zx(item.z), cy: stripY + 13, r: 2, fill: item.type === "worm" ? "var(--series-2)" : "var(--text-secondary)" }, svg);
    });
    const stripLabel = el("text", { x: margin.left - 6, y: stripY + 13, "text-anchor": "end" }, svg);
    stripLabel.textContent = "配置";
  }

  //------------------------------------------------------------
  //グループ化した棒グラフ(ローリングとカウンター成功)
  //------------------------------------------------------------
  function groupedBinChart(container, info, series, valueOf, tooltipTitle) {
    const width = Math.max(container.clientWidth, 320);
    const margin = { top: 8, right: 8, bottom: 24, left: 32 };
    const plotH = 160;
    const height = margin.top + plotH + margin.bottom;
    const svg = el("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" }, container);

    const bins = info.binCount + 1;
    let maxValue = 1;
    for (let b = 0; b < bins; b++) series.forEach(s => { maxValue = Math.max(maxValue, valueOf(b, s.key)); });
    const step = niceStep(maxValue, 4);
    const top = Math.ceil(maxValue / step) * step;
    const plotW = width - margin.left - margin.right;
    const slot = plotW / bins;
    const gap = 2;
    const groupW = Math.max(slot - Math.max(gap * 2, slot * 0.25), 4);
    const barW = Math.max((groupW - gap * (series.length - 1)) / series.length, 1);
    const y = v => margin.top + plotH - (v / top) * plotH;

    for (let v = 0; v <= top; v += step) {
      el("line", { class: v === 0 ? "baseline" : "grid", x1: margin.left, x2: width - margin.right, y1: y(v), y2: y(v) }, svg);
      const t = el("text", { x: margin.left - 6, y: y(v) + 4, "text-anchor": "end" }, svg);
      t.textContent = v;
    }
    for (let b = 0; b < bins; b++) {
      const x0 = margin.left + b * slot + (slot - groupW) / 2;
      series.forEach((s, i) => {
        const v = valueOf(b, s.key);
        if (v <= 0) return;
        const yTop = y(v);
        el("path", { d: topRoundedRect(x0 + i * (barW + gap), yTop, barW, margin.top + plotH - yTop, 4), fill: s.color }, svg);
      });
      const hit = el("rect", { class: "hit", x: margin.left + b * slot, y: margin.top, width: slot, height: plotH }, svg);
      hit.addEventListener("mousemove", e => showTooltip(e, `${binLabel(info, b)}  ${tooltipTitle}`,
        series.map(s => ({ label: s.label, value: valueOf(b, s.key), color: s.color }))));
      hit.addEventListener("mouseleave", hideTooltip);
    }
    const axisY = margin.top + plotH;
    const labelEvery = Math.ceil(5000 / BIN_SIZE);
    for (let b = 0; b <= info.binCount; b += labelEvery) {
      const t = el("text", { x: margin.left + b * slot, y: axisY + 14, "text-anchor": "middle" }, svg);
      t.textContent = (b * BIN_SIZE).toLocaleString();
    }
    const bossLabel = el("text", { x: margin.left + info.binCount * slot + slot / 2, y: axisY + 14, "text-anchor": "middle" }, svg);
    bossLabel.textContent = "ボス";
  }

  //------------------------------------------------------------
  //HPの推移(1回ごとの線 + 平均)
  //------------------------------------------------------------
  function healthChart(container, info) {
    const width = Math.max(container.clientWidth, 320);
    const margin = { top: 8, right: 16, bottom: 24, left: 32 };
    const plotH = 180;
    const height = margin.top + plotH + margin.bottom;
    const svg = el("svg", { viewBox: `0 0 ${width} ${height}`, role: "img" }, container);
    const maxZ = info.bossZ;
    const plotW = width - margin.left - margin.right;
    const x = z => margin.left + (z / maxZ) * plotW;
    const y = hp => margin.top + plotH - (hp / 100) * plotH;

    for (let v = 0; v <= 100; v += 25) {
      el("line", { class: v === 0 ? "baseline" : "grid", x1: margin.left, x2: width - margin.right, y1: y(v), y2: y(v) }, svg);
      const t = el("text", { x: margin.left - 6, y: y(v) + 4, "text-anchor": "end" }, svg);
      t.textContent = v;
    }
    for (let z = 0; z <= maxZ; z += 5000) {
      const t = el("text", { x: x(z), y: margin.top + plotH + 14, "text-anchor": "middle" }, svg);
      t.textContent = z.toLocaleString();
    }

    //1回ごとの線(薄く)
    info.runs.forEach(run => {
      const pts = run.samples.filter(s => s[1] <= maxZ).map(s => `${x(s[1]).toFixed(1)},${y(s[2]).toFixed(1)}`);
      if (pts.length > 1) el("polyline", { points: pts.join(" "), fill: "none", stroke: "var(--run-line)", "stroke-width": 1 }, svg);
    });

    //区間ごとの平均(その区間まで生きていたプレイだけで平均する)
    const avgStep = 500;
    const avg = [];
    for (let z = 0; z <= maxZ; z += avgStep) {
      const values = [];
      info.runs.forEach(run => {
        const near = run.samples.filter(s => Math.abs(s[1] - z) <= avgStep / 2);
        if (near.length) values.push(near[near.length - 1][2]);
      });
      if (values.length) avg.push({ z, hp: values.reduce((a, b) => a + b, 0) / values.length, n: values.length });
    }
    if (avg.length > 1) {
      el("polyline", { points: avg.map(p => `${x(p.z).toFixed(1)},${y(p.hp).toFixed(1)}`).join(" "),
        fill: "none", stroke: "var(--series-1)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);
    }

    //十字線とツールチップ
    const cross = el("line", { x1: 0, x2: 0, y1: margin.top, y2: margin.top + plotH, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" }, svg);
    const dot = el("circle", { r: 4, fill: "var(--series-1)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, svg);
    const hit = el("rect", { class: "hit", x: margin.left, y: margin.top, width: plotW, height: plotH }, svg);
    hit.addEventListener("mousemove", e => {
      if (!avg.length) return;
      const rect = svg.getBoundingClientRect();
      const px = (e.clientX - rect.left) * (width / rect.width);
      const z = ((px - margin.left) / plotW) * maxZ;
      const p = avg.reduce((best, q) => Math.abs(q.z - z) < Math.abs(best.z - z) ? q : best, avg[0]);
      cross.setAttribute("x1", x(p.z)); cross.setAttribute("x2", x(p.z)); cross.setAttribute("visibility", "visible");
      dot.setAttribute("cx", x(p.z)); dot.setAttribute("cy", y(p.hp)); dot.setAttribute("visibility", "visible");
      showTooltip(e, `Z ${p.z.toLocaleString()}`, [
        { label: "平均HP", value: p.hp.toFixed(0), color: "var(--series-1)" },
        { label: "ここまで来たプレイ", value: `${p.n}回` },
      ]);
    });
    hit.addEventListener("mouseleave", () => { hideTooltip(); cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); });
    return avg;
  }

  //------------------------------------------------------------
  //画面全体
  //------------------------------------------------------------
  function render() {
    hideTooltip();
    content.innerHTML = "";
    const summary = document.getElementById("session-summary");
    if (!sessions.length) {
      summary.textContent = "まだログがありません。";
      const empty = html("div", "empty");
      empty.appendChild(html("p", "", "AIテストプレイを実行すると、ここに結果が表示されます。"));
      const p = html("p");
      const code = html("code", "", ".\\DebugTools\\AutoPlay\\Run-AutoPlay.ps1 -Runs 10 -Speed 4");
      p.append("PowerShell で ", code, " を実行してください。");
      empty.appendChild(p);
      content.appendChild(empty);
      return;
    }

    const session = sessions[Number(select.value) || 0];
    const data = session.data;
    const info = analyze(data);
    const s = data.settings || {};
    const skillNames = { beginner: "初心者", normal: "普通", expert: "上級者" };
    summary.textContent = `${data.startedAt ?? ""}  腕前:${skillNames[s.skill] ?? s.skill}  速度:${s.speed}  画面:${s.mode === "hidden" ? "なし" : "あり"}  予定回数:${s.runs}  乱数の種:${s.seed}`;

    //数値のタイル
    const runs = info.runs;
    const clears = runs.filter(r => r.result === "clear");
    const deaths = runs.filter(r => r.result === "death");
    const totalDamage = runs.reduce((a, r) => a + r.damage, 0);
    const counterBullet = runs.reduce((a, r) => a + r.counterBullet, 0);
    const counterBeam = runs.reduce((a, r) => a + r.counterBeam, 0);
    const rolls = runs.reduce((a, r) => a + r.rolls, 0);
    const avgClear = clears.length ? clears.reduce((a, r) => a + r.seconds, 0) / clears.length : null;
    const mmss = sec => `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, "0")}`;
    const tiles = html("div", "tiles");
    const tile = (label, value, detail) => {
      const t = html("div", "tile");
      t.append(html("div", "label", label), html("div", "value", value));
      if (detail) t.appendChild(html("div", "detail", detail));
      tiles.appendChild(t);
    };
    tile("プレイ回数", `${runs.length}回`, runs.length < (s.runs || 0) ? `予定 ${s.runs}回(途中で中断)` : "");
    tile("クリア率", runs.length ? `${Math.round(clears.length / runs.length * 100)}%` : "-", `クリア ${clears.length} / 死亡 ${deaths.length}`);
    tile("平均被弾数", runs.length ? (totalDamage / runs.length).toFixed(1) : "-", `合計 ${totalDamage}回`);
    tile("カウンター成功", `${counterBullet + counterBeam}回`, `敵弾 ${counterBullet} / ビーム ${counterBeam}(ローリング ${rolls}回)`);
    tile("平均クリア時間", avgClear !== null ? mmss(avgClear) : "-", "ステージ開始からボス撃破まで");
    content.appendChild(tiles);

    //被弾した場所
    {
      const box = card("どこで被弾したか", "Z座標1000ごとの被弾回数(全プレイの合計)。下の帯は岩(縦線)と敵(点、オレンジはワーム)の配置。",
        legend(CAUSES.map(c => ({ label: c.label, color: c.color }))));
      const chartBox = html("div", "chart");
      box.appendChild(chartBox);
      content.appendChild(box);
      stackedBinChart(chartBox, info, data.stage?.layout, CAUSES, (b, key) => info.damageBins[b][key] || 0, "被弾");
      box.appendChild(tableView(["区間", ...CAUSES.map(c => c.label), "合計"],
        info.damageBins.map((bin, b) => [binLabel(info, b), ...CAUSES.map(c => bin[c.key] || 0), CAUSES.reduce((a, c) => a + (bin[c.key] || 0), 0)])
          .filter(r => r[r.length - 1] > 0)));
    }

    //死亡した場所
    {
      const box = card("どこで死亡したか", "Z座標1000ごとの死亡回数。色は最後に受けたダメージの原因。",
        legend(CAUSES.map(c => ({ label: c.label, color: c.color }))));
      content.appendChild(box);
      if (!deaths.length) {
        box.appendChild(html("p", "note", "このテストでは一度も死亡していません。"));
      } else {
        const chartBox = html("div", "chart");
        box.appendChild(chartBox);
        stackedBinChart(chartBox, info, data.stage?.layout, CAUSES, (b, key) => info.deathBins[b][key] || 0, "死亡");
      }
      box.appendChild(tableView(["区間", ...CAUSES.map(c => c.label), "合計"],
        info.deathBins.map((bin, b) => [binLabel(info, b), ...CAUSES.map(c => bin[c.key] || 0), CAUSES.reduce((a, c) => a + (bin[c.key] || 0), 0)])
          .filter(r => r[r.length - 1] > 0)));
    }

    //カウンター
    {
      const series = [
        { key: "roll", label: "ローリング(カウンターの入力)", color: "var(--series-1)" },
        { key: "counter", label: "カウンター成功", color: "var(--series-2)" },
      ];
      const valueOf = (b, key) => key === "roll" ? info.rollBins[b] : info.counterBins[b];
      const box = card("どこでカウンターを使ったか", "Z座標1000ごとの、ローリングの回数とカウンター成功の回数。",
        legend(series.map(x => ({ label: x.label, color: x.color }))));
      const chartBox = html("div", "chart");
      box.appendChild(chartBox);
      content.appendChild(box);
      groupedBinChart(chartBox, info, series, valueOf, "カウンター");
      box.appendChild(tableView(["区間", "ローリング", "カウンター成功"],
        info.rollBins.map((v, b) => [binLabel(info, b), v, info.counterBins[b]]).filter(r => r[1] + r[2] > 0)));
    }

    //HPの推移
    {
      const box = card("HPの推移(通常ステージ)", "細い線は1回ごとのHP、太い線はその位置まで来たプレイの平均。ボス戦は含めない。",
        legend([{ label: "平均HP", color: "var(--series-1)", line: true }, { label: "1回ごと", color: "var(--run-line)", line: true }]));
      const chartBox = html("div", "chart");
      box.appendChild(chartBox);
      content.appendChild(box);
      const avg = healthChart(chartBox, info);
      box.appendChild(tableView(["Z", "平均HP", "ここまで来たプレイ"],
        avg.filter(p => p.z % 2500 === 0).map(p => [p.z.toLocaleString(), p.hp.toFixed(0), `${p.n}回`])));
    }

    //1回ごとの結果
    {
      const box = card("1回ごとの結果", "");
      const wrap = html("div", "table-wrap");
      const table = html("table");
      const head = html("tr");
      ["回", "結果", "到達Z", "時間", "被弾", "死因", "カウンター(弾/ビーム)", "ローリング", "撃破"].forEach(h => head.appendChild(html("th", "", h)));
      const thead = html("thead"); thead.appendChild(head); table.appendChild(thead);
      const tbody = html("tbody");
      const resultNames = { clear: "クリア", death: "死亡", timeout: "時間切れ", aborted: "中断" };
      runs.forEach(r => {
        const tr = html("tr");
        tr.appendChild(html("td", "", r.index));
        tr.appendChild(html("td", r.result === "clear" ? "result-clear" : r.result === "death" ? "result-death" : "", resultNames[r.result] ?? r.result));
        tr.appendChild(html("td", "", r.bossAppearFrame >= 0 ? "ボス" : Math.round(r.reachedZ).toLocaleString()));
        tr.appendChild(html("td", "", mmss(r.seconds)));
        tr.appendChild(html("td", "", r.damage));
        tr.appendChild(html("td", "", r.deathCause ? causeOf(r.deathCause).label : "-"));
        tr.appendChild(html("td", "", `${r.counterBullet} / ${r.counterBeam}`));
        tr.appendChild(html("td", "", r.rolls));
        tr.appendChild(html("td", "", r.kills));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      box.appendChild(wrap);
      content.appendChild(box);
    }
  }

  if (window.NOVAWING_PLAYTEST) addSession(window.NOVAWING_PLAYTEST, "latest");
  else render();
})();
</script>
</body>
</html>
